<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fattoria LEGO a doppio kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: lo stabilimento visto dall'alto, flusso da sinistra a destra; i due anelli kanban si leggono dal colore dei cartellini (P rosa, W azzurro) */
  --table:#e2e6de;
  --paper:#fbfaf5;
  --ink:#1c2427;
  --muted:#56646a;
  --line:#c9d0c6;
  --tape:#e7d7a3;
  --postit:#ffe35a;
  --accent:#cc2f27;
  --kp:#d6336c;
  --kp-bg:#ffd9e5;
  --kw:#1f78c8;
  --kw-bg:#d3e8fb;
  --box:#d9c49a;
  --good:#2f7d4f;
  --bad:#b3261e;
  --warn:#9a6200;
  --a-sup:#c9a86a;
  --a-line:#7fb3e6;
  --a-tr:#9aa5ab;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-marker:"Permanent Marker","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--table);
  background-image:radial-gradient(circle at 9px 9px, rgba(255,255,255,.55) 0 3.2px, transparent 3.8px),radial-gradient(circle at 9px 10px, rgba(28,36,39,.07) 0 3.6px, transparent 4.2px);
  background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,6vw,3.6rem);line-height:.98}
h2{font-size:clamp(1.4rem,3.4vw,1.8rem);line-height:1.1}
h3{font-size:1.1rem;line-height:1.2}
p{margin:0}
a{color:var(--kw)}
:focus-visible{outline:3px solid var(--kw);outline-offset:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--ink);color:#f5f3ea}
.brand{font-family:var(--f-display);font-size:1.15rem}
.nav{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#2c373b;position:relative;z-index:6}
.steps-nav{list-style:none;margin:0;padding:2px 0;display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin}
.steps-nav li{flex:none}
.stepb{font:inherit;font-size:.8rem;font-weight:700;white-space:nowrap;background:transparent;color:#cfd8d4;border:1.5px solid #56646a;border-radius:14px;padding:3px 10px;cursor:pointer}
.stepb:hover{border-color:#f5f3ea;color:#fff}
.stepb.done{border-color:#7fb3e6}
.stepb.cur{background:var(--postit);color:var(--ink);border-color:var(--postit)}
.navb{padding:2px 12px;font-size:1.2rem;line-height:1.2;box-shadow:0 2px 0 #000;border-color:#f5f3ea}
.simn{border-left-color:var(--kw)}
.langbtn{font:inherit;font-weight:700;font-size:.85rem;background:transparent;color:#f5f3ea;border:1.5px solid #f5f3ea;border-radius:5px;padding:4px 10px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.stack{display:grid;gap:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.tape{display:inline-block;background:var(--tape);padding:3px 12px 2px;font-family:var(--f-display);font-size:.98rem;
  clip-path:polygon(0 10%,4% 0,50% 7%,96% 0,100% 12%,98% 50%,100% 92%,95% 100%,50% 93%,5% 100%,0 90%,2% 50%);transform:rotate(-1.2deg)}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:7px;padding:10px 16px;cursor:pointer;
  box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.pk{background:var(--kp);color:#fff} .btn.wk{background:var(--kw);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kicker{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--accent)}
.lead{font-size:1.08rem;max-width:62ch;margin-top:10px}
.two{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
.rounds{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.rounds{grid-template-columns:repeat(3,1fr)}}
.rcard{position:relative;padding-top:32px}
.rcard .num{position:absolute;top:-12px;left:14px;background:var(--postit);font-family:var(--f-marker);font-size:1.3rem;width:40px;height:38px;display:grid;place-items:center;transform:rotate(-4deg);box-shadow:0 2px 3px rgba(0,0,0,.18)}
.rcard p{margin-top:6px}
.field{display:grid;gap:4px;margin-top:12px}
.field label,.flabel{font-weight:700;font-size:.92rem}
select,input[type=text],textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical;width:100%}
.credit{font-size:.85rem;color:var(--muted)}
.opts{display:grid;gap:10px;grid-template-columns:1fr;margin-top:8px}
@media(min-width:760px){.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:repeat(2,1fr)}}
.opt{text-align:left;font:inherit;background:var(--paper);border:2px solid var(--line);border-radius:7px;padding:12px;cursor:pointer;display:grid;gap:4px;color:var(--ink)}
.opt small{color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff8d6;box-shadow:0 3px 0 var(--ink)}
/* cartellini e contenitori */
.kc{display:inline-flex;align-items:center;height:17px;padding:0 4px;font-size:.64rem;font-weight:700;border-radius:2px;border:1.5px solid var(--ink);line-height:1}
.kc.p{background:var(--kp);color:#fff} .kc.w{background:var(--kw);color:#fff}
.kc b{margin-right:3px;padding-right:3px;border-right:1px solid rgba(255,255,255,.6)}
.kc{white-space:nowrap}
.ct{display:inline-grid;place-items:center;width:32px;height:24px;background:var(--box);border:1.5px solid var(--ink);border-radius:2px}
.ct svg{max-width:26px;max-height:19px;width:auto;height:auto}
.ct.e{background:rgba(255,255,255,.5);border-style:dashed;width:22px;height:17px;margin-right:3px}
.cw{display:inline-flex;flex-direction:column;align-items:center;gap:1px;margin:3px 3px 0 0}
.hid{visibility:hidden}
#flylayer{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.fly{position:fixed;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.legendk{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px}
.ebox{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-height:22px;font-size:.7rem}
.ebox .pl{font-weight:700;margin-right:4px}
.corr{position:relative;min-height:158px;border-bottom:4px dashed var(--muted);margin:0 2px 22px}
.stop{position:absolute;bottom:-22px;font-size:.72rem;font-weight:700;color:var(--muted)}
.stop.l{left:0} .stop.r{right:0}
.cartp{position:absolute;top:0;width:min(360px,78%);left:calc(var(--pos,1)*(100% - min(360px,78%)));transition:left .1s linear;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:6px 8px;box-shadow:0 3px 0 var(--ink);min-height:128px}
.carth{display:flex;gap:8px;align-items:center;font-size:.85rem;line-height:1.2}
.capt{color:var(--good);font-weight:700}
.cl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin-top:4px;min-height:22px}
.cl .pl{font-size:.7rem;font-weight:700;margin-right:4px;align-self:center}
.more{font-size:.78rem;font-weight:700}
/* partita */
.hud{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 12px;background:var(--ink);color:#f5f3ea;border-radius:0 0 8px 8px;margin:-16px -4px 14px}
.hud .pill{font-family:var(--f-display);font-size:1rem}
.clock{font-family:var(--f-display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.clock.low{color:#ff8f86}
.hstat{display:grid;line-height:1.05}
.hstat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.hstat b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;font-variant-numeric:tabular-nums}
.hud .sp{flex:1}
.hud .btn{padding:5px 11px;font-size:.88rem;box-shadow:0 2px 0 #000;border-color:#f5f3ea}
.floor{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:1040px){.floor{grid-template-columns:1.05fr 1.25fr 1.25fr .8fr;grid-template-rows:auto 1fr;grid-template-areas:"dept mizu mizu asm" "dept super line asm";align-items:stretch}.za-dept{grid-area:dept}.za-super{grid-area:super}.za-line{grid-area:line}.za-mizu{grid-area:mizu}.za-asm{grid-area:asm}}
.zone{border:6px solid var(--tape);border-radius:3px;background:rgba(255,255,255,.4);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.zone>.zh{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.dept{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:5px;min-height:112px;align-content:start}
.dept.you{border:2px solid var(--accent)}
.dept .dh{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:.92rem}
.dept .dh small{font-weight:400;color:var(--muted)}
.post{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:22px;padding:2px 4px;border:1.5px dashed var(--kp);border-radius:4px;background:var(--kp-bg)}
.post.w{border-color:var(--kw);background:var(--kw-bg)}
.post .pl{font-size:.7rem;font-weight:700;margin-right:3px}
.bar{display:block;height:8px;border-radius:4px;background:#e4e1d6;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar.su b{background:var(--warn)}
.jl{font-size:.82rem;display:flex;justify-content:space-between;gap:6px}
.jl .st-work{color:var(--good);font-weight:700} .jl .st-idle{color:var(--muted);font-weight:700}
.last{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.build{height:34px;display:flex;align-items:flex-end;gap:8px}
.bom{display:grid;gap:12px;grid-template-columns:1fr;margin-top:10px}
@media(min-width:620px){.bom{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.bom{grid-template-columns:repeat(4,1fr)}}
.bomc{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff;display:grid;gap:8px;align-content:start}
.bomh{display:flex;align-items:flex-end;gap:10px}
.bomr{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font-size:.85rem;border-top:1px solid var(--line);padding-top:6px}
.bomp{display:flex;justify-content:center}
.bomb{display:block;white-space:nowrap}
.bomb svg{vertical-align:-3px}
.grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:3px;font-size:.78rem}
.grid .gh{text-align:center;font-weight:700;padding:2px 0;line-height:1.1}
.grid .gr{font-weight:700;display:flex;align-items:center;padding-right:4px}
.grid .gc{background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:88px;padding:1px 1px 4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.grid .gc.alert{border:2px solid var(--bad);background:#fde8e6}
.track{position:relative;height:34px;margin:4px 14px 0;border-bottom:3px dashed var(--muted)}
.cart{position:absolute;bottom:2px;transform:translateX(-50%);transition:left .1s linear}
.ends{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.mini{font-size:.82rem}
.cartload{display:flex;flex-wrap:wrap;min-height:26px;align-items:flex-end}
.orders{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:34px}
.alarm{color:var(--bad);font-weight:700;font-size:.85rem}
.ticker{list-style:none;margin:10px 0 0;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:.82rem;display:grid;gap:2px;min-height:5.6em}
.ticker li:first-child{font-weight:700}
.ticker time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.abar{position:sticky;bottom:0;z-index:5;margin:12px -4px 0;padding:10px 12px 12px;background:var(--paper);border:2px solid var(--ink);border-radius:8px 8px 0 0;display:grid;gap:8px;box-shadow:0 -4px 10px rgba(0,0,0,.08)}
.abar .acts{display:flex;flex-wrap:wrap;gap:8px}
.abar .btn{flex:1 1 150px;min-height:52px}
.hint{font-size:.88rem;color:var(--muted);min-height:1.3em}
.pause-ov{position:fixed;inset:0;background:rgba(28,36,39,.55);display:grid;place-items:center;z-index:20;padding:16px}
.pause-ov[hidden]{display:none}
.pause-ov .panel{max-width:380px;width:100%;display:grid;gap:12px;text-align:center}
/* riepiloghi */
.scorebox{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media(min-width:820px){.scorebox{grid-template-columns:280px 1fr}}
.score{background:var(--postit);padding:18px;transform:rotate(-1.5deg);box-shadow:0 3px 6px rgba(0,0,0,.18);text-align:center}
.score .v{font-family:var(--f-marker);font-size:3.8rem;line-height:1;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--good)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tfoot td{font-weight:700;border-bottom:0;font-size:1.05rem}
.tablewrap{overflow-x:auto}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:820px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px}
.tile span{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--muted);font-size:.8rem}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:#d8ddd4;stroke-width:1} .chart .base{stroke:var(--ink);stroke-width:1.2}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.urow{display:grid;grid-template-columns:minmax(110px,200px) 1fr 48px;gap:10px;align-items:center;margin-top:8px;font-size:.9rem}
.ubar{height:14px;background:#e4e1d6;border-radius:3px;overflow:hidden}
.ubar b{display:block;height:100%;background:var(--ink)}
.uval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.note{border-left:5px solid var(--accent);background:#fff;padding:10px 12px;border-radius:0 6px 6px 0}
.steps{margin:10px 0 0;padding-left:1.3em;display:grid;gap:6px}
.ins{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.ins li{padding:8px 10px;background:#fff;border-radius:6px;border:1px solid var(--line)}
.formula{font-family:var(--f-display);font-size:1.25rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:inline-block;margin-top:8px}
.stp{display:inline-grid;grid-template-columns:28px 34px 28px;align-items:center;justify-items:center}
.stp button{font:inherit;font-weight:700;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;padding:0;line-height:1}
.stp b{font-family:var(--f-marker);font-size:1.4rem}
.copyarea{width:100%;min-height:120px;font-size:.85rem;margin-top:8px}
.flash{color:var(--good);font-weight:700}
.loop text{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.loop .bx{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.loop .bt{font-family:var(--f-display);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="topbar"><span class="brand" id="brand">Fattoria LEGO a doppio kanban</span><button class="langbtn" id="langBtn" data-act="lang" aria-label="Language">EN</button></header>
<nav class="nav" id="nav" aria-label="Pagine"></nav>
<main id="app"></main>
<div id="flylayer" aria-hidden="true"></div>
<script>
(function(){
'use strict';
/* ===== Motore di simulazione: sistema kanban a doppio cartellino ===== */
const TYPES=['cow','horse','sheep','duck'];
const COMPS=['legs','body','head'];
const PN=[];COMPS.forEach(c=>TYPES.forEach(ty=>PN.push(c+'-'+ty)));
const MEAN={legs:{cow:3,horse:4,sheep:3,duck:2},body:{cow:5.5,horse:5.5,sheep:7,duck:5},head:{cow:3,horse:3,sheep:2,duck:3}};
const SETUP={legs:1,body:2.5,head:1};
const P={takt:8,asm:5,travel:3,swap:1.4,handle:0.4,cart:8,pitch:20,pitchFast:10,cv:0.25,cvStd:0.08,smed:0.3,ptsDone:10,ptsBacklog:5,ptsWip:1};

function rng32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeSeq(seed,leveled,n){
  n=n||200;const out=[];
  if(leveled){const rot=['cow','sheep','horse','duck'];for(let i=0;i<n;i++)out.push(rot[i%4]);}
  else{const r=rng32(seed);for(let i=0;i<n;i++)out.push(TYPES[Math.floor(r()*4)]);}
  return out;
}

function makeSim(cfg){
  const R=Math.random, imp=new Set(cfg.imp||[]);
  const cv=imp.has('std')?P.cvStd:P.cv;
  const draw=m=>Math.max(0.35*m,m+(R()+R()-1)*cv*m*Math.sqrt(6));
  const pitch=imp.has('pitch')?P.pitchFast:P.pitch;
  let cid=1,kid=1;
  const S={t:0,mode:cfg.mode,dur:cfg.dur,ended:false,imp,human:cfg.human||null,pitch,cv,
    super:{},line:{},empties:[],cells:{},
    asm:{job:null,busy:0,starve:0,missing:[]},
    mizu:{loc:'line',pos:1,act:null,full:[],empty:[],nextDepart:pitch,busy:0,trips:0,swaps:0},
    queue:[],delivered:[],orderIdx:0,log:[],ev:[],samples:[],nextSample:0,
    LP:{},LW:{},stockT:{},shortN:{},produced:0,
    seq:makeSeq(cfg.seqSeed||1,imp.has('heijunka')),nP:cfg.nP,nW:cfg.nW};
  PN.forEach(p=>{S.super[p]=[];S.line[p]=[];S.LP[p]=[];S.LW[p]=[];S.stockT[p]=0;S.shortN[p]=0;});
  COMPS.forEach(c=>{S.cells[c]={post:[],job:null,busy:0,made:0,last:null,lastType:null,setups:0,boxes:0};});
  if(cfg.mode==='kanban'){
    PN.forEach(p=>{const c=p.split('-')[0];
      for(let i=0;i<cfg.nP[c];i++)S.super[p].push({id:cid++,pn:p,card:{k:'P',id:kid++,pn:p}});
      for(let i=0;i<cfg.nW[c];i++)S.line[p].push({id:cid++,pn:p,card:{k:'W',id:kid++,pn:p}});});
  } else PN.forEach(p=>S.line[p].push({id:cid++,pn:p,card:null}));

  const log=(k,a)=>{S.log.push({t:S.t,k,a:a||[]});if(S.log.length>60)S.log.shift();};
  const comp=p=>p.split('-')[0], typ=p=>p.split('-')[1];
  const sum=o=>PN.reduce((s,p)=>s+o[p].length,0);
  const load=()=>S.mizu.full.length+S.mizu.empty.length;
  const isHumanCell=c=>c==='legs'&&S.human==='legs';
  const isHumanM=()=>S.human==='mizu';

  /* --- reparti --- */
  function startProd(c,card,ty){
    ty=card?typ(card.pn):ty;const cell=S.cells[c];
    const su=(cell.lastType&&cell.lastType!==ty)?SETUP[c]*(imp.has('smed')?P.smed:1):0;
    const d=draw(MEAN[c][ty])+su;cell.lastType=ty;if(su)cell.setups++;
    cell.job={pn:c+'-'+ty,card,rem:d,dur:d,setup:su,type:ty,start:S.t};
    if(card){cell.boxes=Math.max(0,cell.boxes-1);S.ev.push({k:'prodStart',c,kid:card.id,pn:card.pn});}
  }
  function finishProd(c){
    const cell=S.cells[c],j=cell.job;
    const nc={id:cid++,pn:j.pn,card:j.card};S.super[j.pn].push(nc);S.ev.push({k:'prodDone',c,pn:j.pn,cid:nc.id,kid:j.card?j.card.id:null});
    if(j.card)S.LP[j.pn].push(S.t-j.card.tPost);
    cell.last={pn:j.pn,dur:j.dur,setup:j.setup,mean:MEAN[c][j.type]};
    cell.job=null;cell.made++;S.produced++;
    log('made',[j.pn,j.dur,!!j.card]);
  }
  function cellsStep(dt){
    COMPS.forEach(c=>{const cell=S.cells[c];
      if(!cell.job&&!isHumanCell(c)){
        if(S.mode==='kanban'){if(cell.post.length)startProd(c,cell.post.shift());}
        else startProd(c,null,TYPES[Math.floor(R()*4)]);
      }
      if(cell.job){cell.busy+=dt;cell.job.rem-=dt;if(cell.job.rem<=0)finishProd(c);}
    });
  }
  /* --- assemblaggio finale --- */
  function asmStep(dt){
    const A=S.asm;
    if(!A.job&&S.queue.length){
      const o=S.queue[0],need=COMPS.map(c=>c+'-'+o.type),miss=need.filter(p=>!S.line[p].length);
      if(!miss.length){
        S.queue.shift();
        const its=[];need.forEach(p=>{const ct=S.line[p].shift();its.push({pn:p,kid:ct.card?ct.card.id:null});if(ct.card){ct.card.tEmpty=S.t;S.empties.push(ct);}});S.ev.push({k:'consume',type:o.type,items:its});
        const d=draw(P.asm);A.job={order:o,rem:d,dur:d};A.missing=[];
      } else {
        if(A.missing.join()!==miss.join()){miss.filter(p=>!A.missing.includes(p)).forEach(p=>{S.shortN[p]++;log('short',[p]);});}
        A.missing=miss;o.waited=true;A.starve+=dt;miss.forEach(p=>S.stockT[p]+=dt);
      }
    }
    if(A.job){A.busy+=dt;A.job.rem-=dt;if(A.job.rem<=0){A.job.order.tDone=S.t;S.delivered.push(A.job.order);log('ship',[A.job.order.type]);A.job=null;}}
  }
  /* --- Mizusumashi --- */
  function findSwap(){
    for(const e of S.mizu.empty){const f=S.super[e.pn].find(x=>x.card&&x.card.k==='P');if(f)return{e,f};}
    return null;
  }
  function mCan(a){
    const M=S.mizu;
    if(S.ended)return'ended';
    if(M.act)return'busy';
    switch(a){
      case'deliver':return M.loc!=='line'?'where':(!M.full.length?'nothing':'');
      case'collect':return M.loc!=='line'?'where':(S.mode!=='kanban'?'mode':(!S.empties.length?'noEmpty':(load()>=P.cart?'cartFull':'')));
      case'goSuper':return M.loc!=='line'?'where':'';
      case'swap':return M.loc!=='super'?'where':(S.mode!=='kanban'?'mode':(!M.empty.length?'noW':(!findSwap()?'noMatch':'')));
      case'loadAll':return M.loc!=='super'?'where':(S.mode!=='push'?'mode':(!sum(S.super)?'superEmpty':(load()>=P.cart?'cartFull':'')));
      case'goLine':return M.loc!=='super'?'where':'';
    }
    return'unknown';
  }
  function startM(kind,extra){
    const M=S.mizu;let d=0,data=null;
    if(kind==='deliver')d=Math.max(0.6,P.handle*M.full.length);
    if(kind==='collect'){const k=Math.min(S.empties.length,P.cart-load());d=Math.max(0.6,P.handle*k);data=k;}
    if(kind==='goSuper'||kind==='goLine'){d=P.travel*(0.9+R()*0.2);if(kind==='goSuper')M.trips++;}
    if(kind==='swap'){data=findSwap();d=P.swap;}
    if(kind==='loadAll'){const k=Math.min(P.cart-load(),sum(S.super));d=Math.max(0.6,P.handle*k);data=k;}
    if(kind==='wait')d=extra;
    M.act={kind,rem:d,dur:d,data};
    if(kind==='deliver')S.ev.push({k:'deliverStart',dur:d,items:M.full.map(c=>({pn:c.pn,cid:c.id,kid:c.card?c.card.id:null}))});
    if(kind==='collect')S.ev.push({k:'collectStart',dur:d,items:S.empties.slice(0,data).map(c=>({pn:c.pn,kid:c.card.id}))});
    if(kind==='swap'&&data)S.ev.push({k:'swapStart',dur:d,pn:data.f.pn,pk:data.f.card.id,wk:data.e.card.id,fc:data.f.id});
    if(kind==='loadAll'){const all=[];PN.forEach(p=>S.super[p].forEach(c=>all.push(c)));all.sort((x,y)=>x.id-y.id);S.ev.push({k:'loadStart',dur:d,items:all.slice(0,data).map(c=>({pn:c.pn,cid:c.id}))});}
    if(kind==='goSuper')log('mGo',[M.empty.length]);
  }
  function completeM(a){
    const M=S.mizu;
    switch(a.kind){
      case'deliver':
        M.full.forEach(f=>{S.line[f.pn].push(f);if(f.card&&f.card.tEmpty!=null){S.LW[f.pn].push(S.t-f.card.tEmpty);f.card.tEmpty=null;}});
        log('mDeliver',[M.full.length]);M.full=[];break;
      case'collect':{const got=S.empties.splice(0,a.data);M.empty.push(...got);log('mCollect',[got.length]);break;}
      case'goSuper':M.loc='super';M.pos=0;break;
      case'goLine':M.loc='line';M.pos=1;break;
      case'swap':{
        const{e,f}=a.data;const i=S.super[f.pn].indexOf(f),j=M.empty.indexOf(e);
        if(i<0||j<0)break;
        S.super[f.pn].splice(i,1);M.empty.splice(j,1);
        const pc=f.card;pc.tPost=S.t;S.cells[comp(f.pn)].post.push(pc);
        f.card=e.card;M.full.push(f);M.swaps++;S.cells[comp(f.pn)].boxes++;
        log('swap',[f.pn]);break;}
      case'loadAll':{
        const all=[];PN.forEach(p=>S.super[p].forEach(c=>all.push(c)));all.sort((x,y)=>x.id-y.id);
        all.slice(0,a.data).forEach(c=>{S.super[c.pn].splice(S.super[c.pn].indexOf(c),1);M.full.push(c);});
        log('mLoad',[a.data]);break;}
    }
    if(a.kind!=='wait')S.ev.push({k:'mDone',kind:a.kind});
  }
  function botMizu(){
    const M=S.mizu;
    if(M.loc==='line'){
      if(M.full.length)return startM('deliver');
      if(S.mode==='kanban'&&S.empties.length&&load()<P.cart)return startM('collect');
      if(S.t<M.nextDepart)return startM('wait',Math.min(0.5,M.nextDepart-S.t));
      while(M.nextDepart<=S.t)M.nextDepart+=S.pitch;
      if(S.mode==='kanban'&&!M.empty.length)return startM('wait',0.5);
      return startM('goSuper');
    }
    if(S.mode==='kanban'){if(findSwap())return startM('swap');}
    else if(sum(S.super)&&load()<P.cart)return startM('loadAll');
    return startM('goLine');
  }
  function mizuStep(dt){
    const M=S.mizu;
    if(!M.act&&!isHumanM())botMizu();
    if(M.act){
      if(M.act.kind!=='wait')M.busy+=dt;
      M.act.rem-=dt;
      const pr=1-Math.max(0,M.act.rem)/M.act.dur;
      if(M.act.kind==='goSuper')M.pos=1-pr;
      if(M.act.kind==='goLine')M.pos=pr;
      if(M.act.rem<=0){const a=M.act;M.act=null;completeM(a);if(!isHumanM())botMizu();}
    }
  }
  function sample(){
    S.samples.push({t:S.t,sup:sum(S.super),line:sum(S.line),tr:S.mizu.full.length,bl:S.queue.length+(S.asm.job?1:0),post:COMPS.map(c=>S.cells[c].post.length)});
  }
  function step(dt){
    if(S.ended)return;
    S.t+=dt;
    while(S.orderIdx*P.takt<=S.t&&S.orderIdx*P.takt<S.dur){S.queue.push({id:S.orderIdx+1,type:S.seq[S.orderIdx],tArr:S.orderIdx*P.takt,waited:false});S.orderIdx++;}
    cellsStep(dt);asmStep(dt);mizuStep(dt);
    while(S.t>=S.nextSample){sample();S.nextSample+=2;}
    if(S.t>=S.dur){S.t=S.dur;S.ended=true;sample();}
  }
  /* --- azioni del giocatore --- */
  function can(role,a,arg){
    if(S.ended)return'ended';
    if(role==='legs'){
      const cell=S.cells.legs;
      if(cell.job)return'busy';
      if(a==='produce')return S.mode!=='kanban'?'mode':(!cell.post.length?'noCard':'');
      if(a==='produceType')return S.mode!=='push'?'mode':'';
    }
    if(role==='mizu')return mCan(a);
    return'unknown';
  }
  function act(role,a,arg){
    if(can(role,a,arg))return false;
    if(role==='legs'){
      if(a==='produce'){const cd=S.cells.legs.post.shift();startProd('legs',cd);log('pTake',[cd.pn]);}
      else startProd('legs',null,arg);
      return true;
    }
    startM(a==='goSuper'?'goSuper':a);return true;
  }
  function wip(){return sum(S.super)+sum(S.line)+S.mizu.full.length+COMPS.filter(c=>S.cells[c].job).length;}
  function result(){
    const bl=S.queue.length+(S.asm.job?1:0),w=wip(),d=S.delivered.length;
    const tt=Math.max(1,S.t);
    const pend=S.queue.concat(S.asm.job?[S.asm.job.order]:[]),nAll=d+pend.length;
    const lead=nAll?(S.delivered.reduce((s,o)=>s+(o.tDone-o.tArr),0)+pend.reduce((s,o)=>s+(S.t-o.tArr),0))/nAll:null;
    const noWait=nAll?S.delivered.filter(o=>!o.waited).length/nAll:0;
    const fam=o=>{const r={};COMPS.forEach(c=>{const a=[];TYPES.forEach(ty=>a.push(...o[c+'-'+ty]));r[c]=a.length?a.reduce((s,x)=>s+x,0)/a.length:null;});return r;};
    const util={};COMPS.forEach(c=>util[c]=Math.min(1,S.cells[c].busy/tt));util.asm=Math.min(1,S.asm.busy/tt);util.mizu=Math.min(1,S.mizu.busy/tt);
    return{mode:S.mode,t:tt,dur:S.dur,delivered:d,backlog:bl,wip:w,orders:S.orderIdx,
      points:d*P.ptsDone-bl*P.ptsBacklog-w*P.ptsWip,lead,noWait,
      LPf:fam(S.LP),LWf:fam(S.LW),stockT:Object.assign({},S.stockT),shortN:Object.assign({},S.shortN),
      util,produced:S.produced,setups:COMPS.reduce((o,c)=>(o[c]=S.cells[c].setups,o),{}),samples:S.samples,
      wipAvg:S.samples.length?S.samples.reduce((s,x)=>s+x.sup+x.line+x.tr,0)/S.samples.length:0,
      starve:S.asm.starve,trips:S.mizu.trips,swaps:S.mizu.swaps,
      nP:cfg.nP,nW:cfg.nW,imp:[...imp],human:S.human,cards:cfg.mode==='kanban'?COMPS.reduce((s,c)=>s+4*(cfg.nP[c]+cfg.nW[c]),0):0};
  }
  return{S,step,can,act,result,wip,load,findSwap};
}


const INK='#1c2427';
/* Modelli LEGO: ogni rettangolo disegnato è un mattoncino della distinta base (vista laterale, tutti i mattoncini sono profondi 2 bottoncini) */
const BW={'2x4':4,'2x3':3,'2x2':2,'1x2':1};
const BCOL={k:'#2b2b2b',w:'#f3f0e8',t:'#d8c690',b:'#9b5a2c',d:'#6b3a17',r:'#cc2f27',c:'#f6eccf',o:'#ee8a22',y:'#f4c430'};
const B=(s,x,y,c)=>({s,x,y,c});
const MODEL={
 cow:{legs:[B('1x2',0,0,'k'),B('1x2',3,0,'k')],body:[B('2x4',0,1,'w'),B('2x4',0,2,'k')],head:[B('2x2',3,3,'w'),B('1x2',3,4,'t')]},
 horse:{legs:[B('1x2',0,0,'b'),B('1x2',3,0,'b'),B('1x2',0,1,'b'),B('1x2',3,1,'b')],body:[B('2x4',0,2,'b'),B('2x2',1,3,'r')],head:[B('1x2',3,3,'b'),B('2x2',3,4,'d')]},
 sheep:{legs:[B('1x2',0,0,'k'),B('1x2',3,0,'k')],body:[B('2x4',0,1,'c'),B('2x4',0,2,'c'),B('2x2',1,3,'c')],head:[B('2x2',3,3,'k')]},
 duck:{legs:[B('2x2',1,0,'o')],body:[B('2x4',0,1,'y'),B('2x2',0,2,'y')],head:[B('2x2',3,2,'o'),B('2x2',2,3,'y')]}
};
const BU=10,BH=9;
function brickRect(b,ox,base,ghost){
  const w=BW[b.s]*BU,x=ox+b.x*BU,y=base-(b.y+1)*BH;
  if(ghost)return'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+BH+'" fill="none" stroke="#6f7c82" stroke-width=".8" stroke-dasharray="2 1.6" opacity=".7"/>';
  let s='';for(let i=0;i<BW[b.s];i++)s+='<rect x="'+(x+i*BU+2.5)+'" y="'+(y-1.8)+'" width="5" height="2" fill="'+BCOL[b.c]+'" stroke="'+INK+'" stroke-width=".6"/>';
  return s+'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+BH+'" fill="'+BCOL[b.c]+'" stroke="'+INK+'" stroke-width=".8"/>';
}
/* o.only: disegna un solo componente (ritagliato); o.n: mattoncini già montati; o.have: componenti presenti */
function drawModel(type,o){
  o=o||{};const m=MODEL[type],comps=o.only?[o.only]:['legs','body','head'];
  let list=[];comps.forEach(c=>m[c].forEach((b,i)=>list.push({b,c,i})));
  list.sort((p,q)=>p.b.y-q.b.y);
  let x0=0,x1=5,y1=5;
  if(o.only){x0=Math.min(...list.map(e=>e.b.x));x1=Math.max(...list.map(e=>e.b.x+BW[e.b.s]));}
  const ymin=o.only?Math.min(...list.map(e=>e.b.y)):0;y1=o.only?Math.max(...list.map(e=>e.b.y))+1:5;
  const base=(y1)*BH+4,ox=2-x0*BU,W=(x1-x0)*BU+4,H=(y1-ymin)*BH+5;
  let out='';
  list.forEach(e=>{
    const present=o.only?(o.n==null||e.i<o.n):(!o.have||o.have.includes(e.c));
    if(present)out+=brickRect(e.b,ox,base,false);else if(o.ghost!==false)out+=brickRect(e.b,ox,base,true);
  });
  if(!o.only||o.only==='head'){
    const hb=m.head.filter(b=>b.s==='2x2').pop();const idx=m.head.indexOf(hb);
    const shown=o.only?(o.n==null||idx<o.n):(!o.have||o.have.includes('head'));
    if(hb&&shown)out+='<circle cx="'+(ox+(hb.x+1.4)*BU)+'" cy="'+(base-(hb.y+1)*BH+3.6)+'" r="1.3" fill="'+((hb.c==='k'||hb.c==='d')?'#fff':INK)+'"/>';
  }
  const w=o.w||50,vy=base-(y1)*BH-3;
  return'<svg viewBox="0 '+vy+' '+W+' '+H+'" width="'+w+'" height="'+Math.round(w*H/W)+'" aria-hidden="true">'+out+'</svg>';
}
function brickChip(s,c){return'<svg viewBox="0 0 '+(BW[s]*BU+4)+' 15" width="'+Math.round((BW[s]*BU+4)*1.1)+'" height="16" aria-hidden="true">'+brickRect({s,x:0,y:0,c},2,13,false)+'</svg>';}

function newRound(n){

const hidden=new Set(),pendingM=[];let swapTok=0;

function partHTML(pn){const a=pn.split('-');return drawModel(a[1],{only:a[0],w:a[0]==='head'?13:22});}
function boxHTML(c,noHide){return'<span class="cw'+(noHide?'':hid('c'+c.id))+'"><span class="ct">'+partHTML(c.pn)+'</span>'+(c.card?cardHTML(c.card.k,c.pn,c.card.id,noHide):'')+'</span>';}

function empties(n){return n?Array(Math.min(n,6)).fill(EMPTY).join('')+(n>6?'<span class="more">+'+(n-6)+'</span>':''):'<span class="muted mini">—</span>';}
function gridHTML(store,pre,alert){

}

function fly(html,from,to,ms,delay){
  if(!U.anim)return;const a=center(from),b=center(to),layer=document.getElementById('flylayer');if(!a||!b||!layer)return;
  const el=document.createElement('div');el.className='fly';el.innerHTML=html;el.style.left=a.x+'px';el.style.top=a.y+'px';layer.appendChild(el);

function niceStep(max){const c=[1,2,5,10,20,25,50,100];for(const s of c)if(max/s<=6)return s;return 200;}
function invSVG(r){
  const sm=r.samples;if(!sm.length)return'';
  const W=640,H=230,pl=36,pr=12,pt=14,pb=30,tmax=r.dur;
  const mx=Math.max(r.cards||0,...sm.map(s=>s.sup+s.line+s.tr),5),st=niceStep(mx),ymax=Math.ceil(mx/st)*st;
  const X=v=>pl+(Math.min(v,tmax)/tmax)*(W-pl-pr),Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  let o='';
  for(let v=0;v<=ymax;v+=st)o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="g"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="ax">'+v+'</text>';
  const xs=tmax>180?60:30;for(let v=0;v<=tmax;v+=xs)o+='<text x="'+X(v)+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+clock(v)+'</text>';
  const lay=[[s=>s.sup+s.line+s.tr,'--a-tr'],[s=>s.sup+s.line,'--a-line'],[s=>s.sup,'--a-sup']];
  const last=sm[sm.length-1];
  lay.forEach(l=>{o+='<polygon points="'+X(sm[0].t)+','+Y(0)+' '+sm.map(s=>X(s.t).toFixed(1)+','+Y(l[0](s)).toFixed(1)).join(' ')+' '+X(last.t)+','+Y(0)+'" style="fill:var('+l[1]+')"/>';});
  if(r.cards)o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(r.cards)+'" y2="'+Y(r.cards)+'" stroke="'+INK+'" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-pr-4)+'" y="'+(Y(r.cards)-5)+'" text-anchor="end" class="lbl">'+esc(t('cap',r.cards))+'</text>';
  o+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" class="base"/>';
  return'<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(t('ch_inv'))+'">'+o+'</svg><div class="legend"><span><i style="background:var(--a-sup)"></i>'+t('l_sup')+'</span><span><i style="background:var(--a-line)"></i>'+t('l_line')+'</span><span><i style="background:var(--a-tr)"></i>'+t('l_tr')+'</span></div>';
}

/* ---------- Navigazione ---------- */
const STEPS=['intro','g1','s1','inter','g2','s2','retro','g3','s3','debrief'];
function curStep(){
  if(U.screen==='game')return STEPS.indexOf('g'+U.round);
  if(U.screen==='summary')return STEPS.indexOf('s'+U.round);
  return Math.max(0,STEPS.indexOf(U.screen));
}
function simRound(k){
  const m=makeSim({mode:k===1?'push':'kanban',dur:U.cfg.dur,seqSeed:U.seed,nP:Object.assign({},U.nP),nW:Object.assign({},U.nW),imp:k===3?U.imp.slice():[],human:null});
  while(!m.S.ended)m.step(0.1);
  const r=m.result();r.round=k;r.sim=true;U.results[k-1]=r;
}
function goStep(i){
  const st=STEPS[Math.max(0,Math.min(STEPS.length-1,i))];paused=false;
  if(st[0]==='g'){newRound(+st[1]);return;}
  if(st[0]==='s'){const k=+st[1];if(!U.results[k-1])simRound(k);U.round=k;go('summary');return;}
  if(st==='debrief'){[1,2,3].forEach(k=>{if(!U.results[k-1])simRound(k);});}
  if(st==='retro')U.round=2;
  if(st==='inter')U.round=1;
  go(st);
}
function navHTML(){
  const c=curStep();
  return'<button class="btn navb" data-act="nav" data-i="'+(c-1)+'"'+(c<=0?' disabled':'')+' aria-label="'+esc(t('navPrev'))+'">‹</button><ol class="steps-nav">'+
    STEPS.map((st,i)=>'<li><button class="stepb'+(i===c?' cur':'')+(st[0]==='s'&&U.results[+st[1]-1]?' done':'')+'" data-act="nav" data-i="'+i+'"'+(i===c?' aria-current="step"':'')+'>'+t('st_'+st)+'</button></li>').join('')+
    '</ol><button class="btn navb" data-act="nav" data-i="'+(c+1)+'"'+(c>=STEPS.length-1?' disabled':'')+' aria-label="'+esc(t('navNext'))+'">›</button>';
}
function go(s){U.screen=s;render();window.scrollTo(0,0);}
function render(){
  document.documentElement.lang=U.lang;$('#langBtn').textContent=U.lang==='it'?'EN':'IT';$('#brand').textContent=t('title');document.title=t('title');
  Object.keys(cache).forEach(k=>delete cache[k]);clearFx();
  const nv=document.getElementById('nav');if(nv){nv.innerHTML=navHTML();const cur=nv.querySelector('.cur');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
  const app=$('#app');
  if(U.screen==='game'){app.innerHTML=gameSkeleton();updateGame();return;}
  app.innerHTML=({intro:introHTML,summary:summaryHTML,inter:interHTML,retro:retroHTML,debrief:debriefHTML})[U.screen]();
  if(U.screen==='summary')countUp();
}
function countUp(){
  const el=document.getElementById('countup');if(!el||reduceMotion)return;
  const v=+el.dataset.v,t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(v*e);if(p<1)requestAnimationFrame(f);};
  el.textContent='0';requestAnimationFrame(f);
}
function act(a,el){
  switch(a){
    case'lang':U.lang=U.lang==='it'?'en':'it';render();break;
    case'role':U.cfg.role=el.dataset.r;document.querySelectorAll('[data-act=role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.r===U.cfg.role)));break;
    case'start1':U.results=[];U.imp=[];U.notes='';U.seed=1+Math.floor(Math.random()*1e6);newRound(1);break;
    case'start2':newRound(2);break;
    case'start3':newRound(3);break;
    case'pause':if(sim&&!sim.S.ended){paused=!paused;setText('u-pz',paused?t('resume'):t('pause'));updateGame();}break;
    case'endnow':paused=false;if(sim){sim.S.ended=true;finishRound();}break;
    case'nav':goStep(+el.dataset.i);break;
    case'ffwd':if(sim&&!sim.S.ended){paused=false;sim.S.human=null;while(!sim.S.ended)sim.step(0.1);finishRound();}break;
    case'anim':U.anim=!U.anim;if(!U.anim)clearFx();updateGame();break;
    case'speed':U.cfg.speed=U.cfg.speed===1?2:(U.cfg.speed===2?4:1);updateGame();break;
    case'ptype':if(!paused&&sim){sim.act('legs','produceType',el.dataset.type);updateGame();}break;
    case'take':if(!paused&&sim){sim.act('legs','produce');updateGame();}break;
    case'm':if(!paused&&sim){sim.act('mizu',el.dataset.a);updateGame();}break;
    case'next':go(U.round===1?'inter':(U.round===2?'retro':'debrief'));break;
    case'kn':{const k=el.dataset.k,c=el.dataset.c,o=U['n'+k];o[c]=Math.max(1,Math.min(5,o[c]+(+el.dataset.d)));setText('kn-'+k+'-'+c,String(o[c]));setText('cap-now',t('capNow',capOf()));break;}
    case'imp':{const k=el.dataset.k,i=U.imp.indexOf(k),hint=document.getElementById('imp-hint');
      if(i>=0)U.imp.splice(i,1);else if(U.imp.length<2)U.imp.push(k);else{if(hint)hint.textContent=t('maxImp');break;}
      if(hint)hint.textContent='';document.querySelectorAll('[data-act=imp]').forEach(b=>b.setAttribute('aria-pressed',String(U.imp.includes(b.dataset.k))));break;}
    case'copy':{const msg=document.getElementById('copy-msg'),fail=()=>{msg.textContent=t('copyFail');const ta=document.getElementById('f-copy');if(ta)ta.select();};
      try{navigator.clipboard.writeText(resultsText()).then(()=>{msg.textContent=t('copied');msg.className='small flash';},fail);}catch(e){fail();}break;}
    case'restart':U.results=[];U.imp=[];U.notes='';U.nP={legs:2,body:2,head:2};U.nW={legs:2,body:2,head:2};sim=null;go('intro');break;
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b);});
document.addEventListener('input',e=>{if(e.target.id==='f-team')U.cfg.team=e.target.value;if(e.target.id==='f-notes')U.notes=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='f-dur')U.cfg.dur=+e.target.value;if(e.target.id==='f-spd')U.cfg.speed=+e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.screen==='game')act('pause');});
setInterval(()=>{
  const now=performance.now();let dt=(now-lastNow)/1000;lastNow=now;if(dt>0.25)dt=0.25;
  if(sim&&U.screen==='game'){
    if(!paused&&!sim.S.ended)for(let i=0;i<U.cfg.speed;i++)sim.step(dt);
    const evs=sim.S.ev.splice(0);if(!sim.S.ended)evs.forEach(handleEv);
    if(sim.S.ended){finishRound();return;}
    updateGame();
  }
},100);
function snapshot(){const pre={1:'intro',2:'inter',3:'retro'};return{lang:U.lang,cfg:U.cfg,nP:U.nP,nW:U.nW,imp:U.imp,notes:U.notes,results:U.results,round:U.round,seed:U.seed,screen:U.screen==='game'?pre[U.round]:U.screen};}
function start(d){
  if(d&&d.lang){Object.assign(U,{lang:d.lang,cfg:d.cfg||U.cfg,nP:d.nP||U.nP,nW:d.nW||U.nW,imp:d.imp||[],notes:d.notes||'',results:d.results||[],round:d.round||1,seed:d.seed||1,screen:d.screen||'intro'});
    if(U.screen==='summary'&&!U.results[U.round-1])U.screen='intro';}
  render();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(snapshot);}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});

})();
</script>
</body>
</html>
